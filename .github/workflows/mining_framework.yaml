
name: Mining Framework Check
on: [push]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Fetch git submodules
              run: git submodule update --init --recursive || echo "Could not fetch some submodules"

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                cache: gradle
                java-version: |
                  8
                  17
                  21
                  25
                  11
            - name: Remove settings.xml created by setup-java
              run: rm -f ~/.m2/settings.xml

            - name: Grant execute permission for gradlew
              run: if [ -f "gradlew" ]; then chmod +x gradlew; fi

            - name: Run Gradle Tests
              uses: nick-fields/retry@v3
              with:
                timeout_minutes: 30
                max_attempts: 3
                command: ./gradlew test --no-build-cache -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
        
        